---
layout: default
---
<article class="prose page">
  {% if page.title and page.title != "" %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
  {% if page.collection == "posts" %}
    <p class="page-meta">{{ page.date | date: "%B %Y" }}</p>
    {% if page.header.teaser %}<img class="page-teaser" src="{{ page.header.teaser }}" alt="">{% endif %}
  {% endif %}
  {{ content }}
</article>
