<ul class="news">
{%- for item in site.data.news -%}
  {%- if include.limit and forloop.index > include.limit -%}{%- break -%}{%- endif -%}
  <li><span class="news-date">{{ item.date }}</span><span class="news-text">{{ item.text | markdownify | remove: "<p>" | remove: "</p>" }}</span></li>
{%- endfor -%}
</ul>
